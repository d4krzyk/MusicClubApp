<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/icon-192.png" />

    <!--
      Od tych trzech rzeczy zalezy, czy Android potraktuje strone jak aplikacje:
      manifest (nazwa, ikony, tryb pelnoekranowy), ikona dla iOS, i kolor paska
      stanu. Czwarta - service worker - rejestruje sie w src/main.jsx.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Pasek stanu telefonu dostaje kolor tla strony, osobny dla kazdego motywu -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f2fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131019" />

    <title>MusicClub</title>

    <!--
      Motyw ustawiamy TU, a nie w Reakcie.

      Ten skrypt wykonuje sie, zanim przegladarka cokolwiek narysuje. Gdyby
      motyw ustawial dopiero React, przy jasnym motywie przez ulamek sekundy
      mignelaby ciemna strona (tzw. "flash of wrong theme") - widac to
      szczegolnie przy odswiezaniu.

      Kolejnosc wyboru: zapisany wybor uzytkownika -> ustawienie systemu.
      Blok try/catch, bo w trybie prywatnym niektore przegladarki rzucaja
      wyjatkiem przy samym siegnieciu po localStorage.
    -->
    <script>
      (function () {
        var zapisany = null;
        try {
          zapisany = localStorage.getItem('motyw');
        } catch (e) {
          /* brak dostepu do pamieci - lecimy dalej z ustawieniem systemu */
        }
        var systemowy = window.matchMedia('(prefers-color-scheme: light)').matches
          ? 'light'
          : 'dark';
        document.documentElement.setAttribute('data-bs-theme', zapisany || systemowy);
      })();
    </script>
  </head>
  <body>
    <!-- React wstrzykuje tu cala aplikacje - patrz src/main.jsx -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
