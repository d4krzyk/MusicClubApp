# =============================================================================
#  Serwer frontendu w kontenerze.
#
#  Robi dwie rzeczy:
#   1. oddaje zbudowane pliki Reacta,
#   2. przekazuje /api i /uploads do backendu.
#
#  Punkt 2 jest tu najwazniejszy: dzieki niemu przegladarka widzi WSZYSTKO
#  pod jednym adresem (http://localhost:3000), wiec ciasteczko sesji i token
#  CSRF dzialaja bez zadnych sztuczek - i CORS w ogole nie wchodzi do gry.
#  To dokladnie ta sama sztuczka, ktora w trybie deweloperskim robi proxy
#  Vite (patrz vite.config.js).
# =============================================================================

server {
    listen 80;
    server_name _;

    # Nazwa "backend" pochodzi z docker-compose.yml - Docker sam zamienia ja
    # na adres IP kontenera. Dlatego nie ma tu zadnego localhost.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Wgrane zdjecia (avatary, obrazki w postach) tez leza po stronie backendu
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;

        # Aplikacja jednostronicowa: adresy w rodzaju /profil/ala nie istnieja
        # jako pliki na dysku. Bez tej linijki odswiezenie takiej strony (F5)
        # konczy sie bledem 404 - obsluga trasy siedzi dopiero w JavaScripcie.
        try_files $uri $uri/ /index.html;
    }

    # Gotowe pliki maja losowe nazwy nadane przez Vite (index-a1b2c3.js),
    # wiec mozna je smialo cache'owac na dlugo - przy zmianie i tak zmieni
    # sie nazwa. Samego index.html NIE cache'ujemy, bo to on wskazuje
    # na aktualne nazwy.
    location ~* \.(js|css|woff2?|png|jpe?g|svg|ico)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
