# =============================================================================
#  Serwer frontendu w kontenerze.
#
#  Robi dwie rzeczy:
#   1. oddaje zbudowane pliki Reacta,
#   2. przekazuje /api i /uploads do backendu.
#
#  Punkt 2 jest tu najwazniejszy: dzieki niemu przegladarka widzi WSZYSTKO
#  pod jednym adresem (http://localhost:3000), wiec ciasteczko sesji i token
#  CSRF dzialaja bez zadnych sztuczek - i CORS w ogole nie wchodzi do gry.
#  To dokladnie ta sama sztuczka, ktora w trybie deweloperskim robi proxy
#  Vite (patrz vite.config.js).
# =============================================================================

# =============================================================================
#  Skad przyszlo zapytanie: po HTTP czy po HTTPS.
#
#  Na produkcji przed tym nginx stoi jeszcze cos, co konczy HTTPS - Caddy albo
#  tunel Cloudflare - i dalej rozmawia z nami zwyklym HTTP. Ten ktos zostawia
#  informacje o oryginalnym protokole w naglowku X-Forwarded-Proto.
#
#  Gdybysmy nizej wpisali na sztywno $scheme, nadpisalibysmy to wartoscia
#  "http" - bo do nginx faktycznie przychodzi HTTP. Spring uznalby wtedy, ze
#  aplikacja stoi na nieszyfrowanym polaczeniu i NIE USTAWILBY flagi Secure
#  na ciasteczku sesji. Logowanie dzialaloby dalej, wiec nikt by tego nie
#  zauwazyl - a ciasteczko chodziloby bez ochrony.
#
#  Dlatego: jesli naglowek przyszedl, przepuszczamy go dalej bez zmian.
#  Jesli nie (uruchomienie lokalne, bez niczego z przodu) - bierzemy $scheme.
# =============================================================================
map $http_x_forwarded_proto $protokol_zrodlowy {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # Nazwa "backend" pochodzi z docker-compose.yml - Docker sam zamienia ja
    # na adres IP kontenera. Dlatego nie ma tu zadnego localhost.
    resolver 127.0.0.11 valid=10s;

    # =========================================================================
    #  ROZMIAR WGRYWANYCH PLIKOW
    #
    #  Domyslnie nginx przepuszcza 1 MB i odrzuca wieksze z kodem 413 - zanim
    #  cokolwiek dotrze do backendu. Zdjecie z telefonu ma 2-5 MB, wiec KAZDE
    #  wgranie zdjecia konczylo sie bledem. Frontend pokazywal to jako brak
    #  polaczenia z serwerem, bo odpowiedz 413 nginx odsyla jako strone HTML,
    #  a nie jako nasz JSON z komunikatem.
    #
    #  W trybie deweloperskim tego nie widac: proxy Vite nie ma takiego limitu.
    #
    #  Wartosc jest o cztery megabajty WIEKSZA niz spring.servlet.multipart
    #  .max-request-size (60MB). Dzieki temu o odrzuceniu decyduje aplikacja,
    #  ktora odesle zrozumialy komunikat, a nie nginx ze swoja strona bledu.
    # =========================================================================
    client_max_body_size 64m;

    # =========================================================================
    #  KOMPRESJA
    #
    #  Bez tego przegladarka pobiera przy pierwszym wejsciu 550 kB JavaScriptu
    #  i 271 kB stylow. Po spakowaniu to 176 kB i 39 kB - z 821 kB robi sie
    #  215 kB, czyli prawie cztery razy mniej. Na telefonie w terenie to
    #  roznica miedzy "otwiera sie" a "otwiera sie zaraz".
    #
    #  Obrazkow NIE pakujemy: JPEG, PNG i WebP sa juz skompresowane, wiec
    #  gzip tylko zjadlby procesor, nic nie zyskujac. Dlatego na liscie
    #  ponizej sa wylacznie formaty tekstowe (svg to tekst, mimo ze obrazek).
    #
    #  gzip_vary dokłada naglowek "Vary: Accept-Encoding" - bez niego
    #  posrednik moglby podac spakowana odpowiedz komus, kto jej nie obsluguje.
    # =========================================================================
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # =========================================================================
    #  UWAGA na modyfikator "^~" przy obu blokach ponizej. To NIE jest ozdoba.
    #
    #  nginx dobiera blok w takiej kolejnosci:
    #    1. dokladne dopasowanie (=),
    #    2. najdluzszy pasujacy PRZEDROSTEK - i jesli ma "^~", konczy tutaj,
    #    3. WYRAZENIA REGULARNE (~ i ~*) - pierwsze pasujace wygrywa,
    #    4. dopiero na koncu zapamietany przedrostek.
    #
    #  Bez "^~" krok 3 wyprzedza przedrostek. Adres /uploads/abc.jpg pasowal
    #  wiec do bloku z wyrazeniem regularnym na dole pliku (\.jpe?g$), ktory
    #  szuka pliku na dysku frontendu - a tam go nie ma. Efekt: KAZDE wgrane
    #  zdjecie (awatary i obrazki w postach) konczylo sie bledem 404 w Dockerze,
    #  mimo ze w trybie deweloperskim wszystko dzialalo, bo proxy Vite nie ma
    #  zadnej reguly z wyrazeniem regularnym.
    #
    #  "^~" mowi nginxowi: dopasowalem przedrostek, nie sprawdzaj juz regulek.
    # =========================================================================

    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $protokol_zrodlowy;

        # Z adresu, pod ktorym przyszlo zapytanie, backend buduje link
        # w wiadomosci potwierdzajacej (gdy nie ma APP_PUBLIC_URL). Naglowki
        # przyslane przez klienta NADPISUJEMY: inaczej ktos moglby zalozyc
        # konto na cudzy adres z "X-Forwarded-Host: jego-strona.pl" i wlasciciel
        # skrzynki dostalby prawdziwy token w linku do obcej strony.
        # Pusta wartosc znaczy w nginx "nie przekazuj naglowka wcale".
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Port   "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded          "";
    }

    # Wgrane zdjecia (avatary, obrazki w postach) tez leza po stronie backendu
    location ^~ /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;

        # Aplikacja jednostronicowa: adresy w rodzaju /profil/ala nie istnieja
        # jako pliki na dysku. Bez tej linijki odswiezenie takiej strony (F5)
        # konczy sie bledem 404 - obsluga trasy siedzi dopiero w JavaScripcie.
        try_files $uri $uri/ /index.html;
    }

    # Gotowe pliki maja losowe nazwy nadane przez Vite (index-a1b2c3.js),
    # wiec mozna je smialo cache'owac na dlugo - przy zmianie i tak zmieni
    # sie nazwa. Samego index.html NIE cache'ujemy, bo to on wskazuje
    # na aktualne nazwy.
    #
    # Ta regula dotyczy WYLACZNIE plikow aplikacji. Wgrane przez uzytkownikow
    # obrazki sa wylapane wyzej przez "^~ /uploads/" i tu nie docieraja -
    # i bardzo dobrze, bo one moga sie zmienic pod tym samym adresem.
    location ~* ^/assets/.*\.(js|css|woff2?|png|jpe?g|svg|ico)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
