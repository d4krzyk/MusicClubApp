# =============================================================================
#  Serwer frontendu w kontenerze.
#
#  Robi dwie rzeczy:
#   1. oddaje zbudowane pliki Reacta,
#   2. przekazuje /api i /uploads do backendu.
#
#  Punkt 2 jest tu najwazniejszy: dzieki niemu przegladarka widzi WSZYSTKO
#  pod jednym adresem (http://localhost:3000), wiec ciasteczko sesji i token
#  CSRF dzialaja bez zadnych sztuczek - i CORS w ogole nie wchodzi do gry.
#  To dokladnie ta sama sztuczka, ktora w trybie deweloperskim robi proxy
#  Vite (patrz vite.config.js).
# =============================================================================

server {
    listen 80;
    server_name _;

    # Nazwa "backend" pochodzi z docker-compose.yml - Docker sam zamienia ja
    # na adres IP kontenera. Dlatego nie ma tu zadnego localhost.
    resolver 127.0.0.11 valid=10s;

    # =========================================================================
    #  UWAGA na modyfikator "^~" przy obu blokach ponizej. To NIE jest ozdoba.
    #
    #  nginx dobiera blok w takiej kolejnosci:
    #    1. dokladne dopasowanie (=),
    #    2. najdluzszy pasujacy PRZEDROSTEK - i jesli ma "^~", konczy tutaj,
    #    3. WYRAZENIA REGULARNE (~ i ~*) - pierwsze pasujace wygrywa,
    #    4. dopiero na koncu zapamietany przedrostek.
    #
    #  Bez "^~" krok 3 wyprzedza przedrostek. Adres /uploads/abc.jpg pasowal
    #  wiec do bloku z wyrazeniem regularnym na dole pliku (\.jpe?g$), ktory
    #  szuka pliku na dysku frontendu - a tam go nie ma. Efekt: KAZDE wgrane
    #  zdjecie (awatary i obrazki w postach) konczylo sie bledem 404 w Dockerze,
    #  mimo ze w trybie deweloperskim wszystko dzialalo, bo proxy Vite nie ma
    #  zadnej reguly z wyrazeniem regularnym.
    #
    #  "^~" mowi nginxowi: dopasowalem przedrostek, nie sprawdzaj juz regulek.
    # =========================================================================

    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Wgrane zdjecia (avatary, obrazki w postach) tez leza po stronie backendu
    location ^~ /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;

        # Aplikacja jednostronicowa: adresy w rodzaju /profil/ala nie istnieja
        # jako pliki na dysku. Bez tej linijki odswiezenie takiej strony (F5)
        # konczy sie bledem 404 - obsluga trasy siedzi dopiero w JavaScripcie.
        try_files $uri $uri/ /index.html;
    }

    # Gotowe pliki maja losowe nazwy nadane przez Vite (index-a1b2c3.js),
    # wiec mozna je smialo cache'owac na dlugo - przy zmianie i tak zmieni
    # sie nazwa. Samego index.html NIE cache'ujemy, bo to on wskazuje
    # na aktualne nazwy.
    #
    # Ta regula dotyczy WYLACZNIE plikow aplikacji. Wgrane przez uzytkownikow
    # obrazki sa wylapane wyzej przez "^~ /uploads/" i tu nie docieraja -
    # i bardzo dobrze, bo one moga sie zmienic pod tym samym adresem.
    location ~* ^/assets/.*\.(js|css|woff2?|png|jpe?g|svg|ico)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
