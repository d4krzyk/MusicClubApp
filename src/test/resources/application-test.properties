# =============================================================================
#  Profil "test" - wyklad 2, slajd 40 (application-{profil}.properties)
# =============================================================================
#  WAZNE, dlaczego to jest profil, a nie zwykly application.properties:
#
#  Plik o nazwie application.properties w src/test/resources NIE laczy sie
#  z tym z src/main/resources - on go CALKOWICIE ZASTEPUJE. Skutek jest taki,
#  ze w testach znikaja wszystkie pozostale ustawienia: sciezka do plikow
#  z tlumaczeniami, konfiguracja Swaggera, klucz "zapamietaj mnie".
#  Objawia sie to potem bledem "No message found under code ...".
#
#  Plik application-{profil}.properties dziala inaczej - jest DOKLADANY
#  na wierzch application.properties i nadpisuje tylko te klucze, ktore
#  faktycznie tu wypiszemy. Reszta ustawien zostaje.
#
#  Wlaczamy go adnotacja @ActiveProfiles("test") nad klasa testowa.
# =============================================================================

# Baza H2 w pamieci zamiast PostgreSQL - dzieki temu `mvn test` dziala
# przy wylaczonym Dockerze, a kazdy test startuje na czystej bazie.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

# Mniej halasu w konsoli podczas testow
spring.jpa.show-sql=false
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Testy nigdy nie pytaja prawdziwego Ticketmastera - nawet gdy ktos ma klucz
# ustawiony w zmiennej srodowiskowej TICKETMASTER_API_KEY. Bez tego wpisu
# import w tle ruszylby w polowie przebiegu testow i poszedl do sieci.
app.ticketmaster.api-key=

# To samo dla Last.fm - uzupelnianie gatunkow w tle nie moze isc do sieci.
app.lastfm.api-key=

# Testy nie wysylaja poczty - potwierdzanie adresow sprawdzaja wlasne testy
# z udawanym serwerem SMTP.
spring.mail.host=

# Przypomnienia o wydarzeniach nie ruszaja same w polowie testow (od 9 do 21
# trafilyby w dowolny test z zapisami) - testy wolaja je wprost.
app.events.reminders.cron=-

# Push wylaczony, nawet gdy ktos ma klucze VAPID w zmiennych srodowiskowych.
app.push.public-key=
app.push.private-key=

# Przypomnienia o spotkaniach tez nie ruszaja same (co minute trafilyby w dowolny test ze spotkaniem).
app.meetings.reminders.cron=-

# Sprzatanie prosb do ekip nie rusza samo w polowie dlugiego przebiegu (testy wolaja je wprost).
app.crews.cleanup.initial-delay-ms=86400000

# Zrodla poboczne wydarzen nigdy nie ida do sieci w testach - testy podstawiaja udawane serwery same.
app.events.bandsintown.app-id=
app.events.songkick.api-key=
app.events.secondary.initial-delay-ms=86400000
