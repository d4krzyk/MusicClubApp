# =============================================================================
#  Konfiguracja UZYWANA TYLKO PODCZAS TESTOW (src/test/resources)
# =============================================================================
#  Testy chodza na bazie H2 trzymanej w pamieci RAM. Dzieki temu:
#    - `mvn test` dziala nawet gdy Docker jest wylaczony,
#    - kazdy test startuje na czystej bazie (brak "smieci" po poprzednim tescie),
#    - testy sa szybkie.
#
#  MODE=PostgreSQL sprawia, ze H2 udaje skladnie PostgreSQL-a, wiec nasze
#  zapytania @Query zachowuja sie podobnie jak na produkcyjnej bazie.
# =============================================================================
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
