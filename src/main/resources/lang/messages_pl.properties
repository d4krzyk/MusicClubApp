#  Ten plik musi miec DOKLADNIE te same klucze co messages.properties.
#  Jesli klucza tu zabraknie, Spring wezmie wersje angielska.
#
#  Polskie znaki zapisujemy wprost (a, e, s...), bo w application.properties
#  ustawilismy spring.messages.encoding=UTF-8. Wyklad 2 (slajd 41) wspomina
#  o zapisie \uXXXX - to bylo potrzebne w starszych wersjach Javy, dzis
#  wystarczy poprawne kodowanie pliku.
# =============================================================================

# --- Walidacja: login ---
validation.username.notblank=Login jest wymagany
validation.username.size=Login musi mieć od {min} do {max} znaków
validation.username.pattern=Login może zawierać tylko litery, cyfry oraz znaki _ . -
validation.username.taken=Ten login jest już zajęty

# --- Walidacja: e-mail ---
validation.email.notblank=Adres e-mail jest wymagany
validation.email.invalid=Podaj poprawny adres e-mail
validation.email.size=Adres e-mail może mieć najwyżej {max} znaków

# --- Walidacja: haslo ---
validation.password.notblank=Hasło jest wymagane
validation.password.size=Hasło musi mieć od {min} do {max} znaków
validation.password.confirm.notblank=Powtórz hasło
validation.password.mismatch=Hasła nie są takie same

# --- Bledy ogolne ---
error.validation=Błąd walidacji. Szczegóły w polu "errors".
error.notfound=Nie znaleziono: {0} o identyfikatorze {1}
error.badcredentials=Nieprawidłowy login lub hasło
error.username.taken=Ten login jest już zajęty
error.email.taken=Konto z tym adresem e-mail już istnieje
error.internal=Wystąpił nieoczekiwany błąd. Spróbuj ponownie później.
