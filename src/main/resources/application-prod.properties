# =============================================================================
#  USTAWIENIA PRODUKCYJNE
#
#  Wlaczane profilem: SPRING_PROFILES_ACTIVE=prod
#  (docker-compose.prod.yml ustawia to za Ciebie).
#
#  Ten plik NIE zawiera zadnych hasel ani kluczy - wszystkie wrazliwe wartosci
#  przychodza ze zmiennych srodowiskowych, a te z pliku .env, ktory nie trafia
#  do repozytorium.
#
#  Aplikacja CELOWO nie wstanie, jesli zabraknie kluczowych zmiennych. Lepiej,
#  zeby nie wystartowala, niz zeby ruszyla z kluczem z repozytorium.
# =============================================================================

# --- SCHEMAT BAZY ------------------------------------------------------------
# validate = Hibernate tylko sprawdza, czy baza zgadza sie z encjami, i przerywa
# start, jesli sie rozjechaly. Sam nic nie tworzy ani nie zmienia - od tego sa
# migracje w db/migration.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Baza zalozona wczesniej przez ddl-auto=update ma juz tabele, ale nie ma
# tabeli historii Flyway. Bez tego ustawienia migracja V1 probowalaby stworzyc
# istniejace tabele i przerwalaby start.
#
# baseline-on-migrate zapisuje taka baze jako "stan V1 juz osiagniety"
# i zaczyna liczyc od kolejnych migracji.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- WARTOSCI, KTORYCH MUSISZ PODAC ------------------------------------------
# Brak wartosci domyslnej jest tu CELOWY. Jesli zmiennej nie bedzie, Spring
# przerwie start z czytelnym bledem - zamiast ruszyc z kluczem, ktory kazdy
# moze odczytac z repozytorium.
#
# REMEMBER_ME_KEY podpisuje ciasteczko "zapamietaj mnie". Kto zna klucz,
# podpisze sobie takie ciasteczko na dowolna nazwe uzytkownika i zaloguje sie
# jako ktokolwiek - bez znajomosci hasla. Wygeneruj wlasny, dlugi i losowy.
app.remember-me.key=${REMEMBER_ME_KEY}
app.admin.password=${ADMIN_PASSWORD}

# --- CORS --------------------------------------------------------------------
# Pusta lista, i tak ma byc. Frontend i API stoja pod jednym adresem (nginx
# przekazuje /api do backendu), wiec przegladarka w ogole nie wysyla naglowka
# Origin i CORS nie wchodzi do gry. Zostawienie tu adresow localhost pozwalaloby
# czyjemus lokalnemu frontendowi wolac to API razem z ciasteczkiem sesji.
app.cors.allowed-origins=${CORS_ORIGINS:}

# --- CIASTECZKA --------------------------------------------------------------
# Logowanie stoi na ciasteczku sesji, wiec te trzy ustawienia decyduja
# o bezpieczenstwie calego logowania.
#
# secure   - ciasteczko leci wylacznie po HTTPS
# http-only- JavaScript go nie odczyta, wiec nie wyniesie go wstrzykniety skrypt
# same-site=lax - przegladarka nie dolaczy go do zapytan z obcych stron,
#                 co blokuje podstawowa odmiane ataku CSRF
#
# Dla aplikacji na Androidzie (TWA) zostaje "lax": TWA to ten sam Chrome
# i ten sam adres, wiec ciasteczko jest pierwszej strony. Gdyby frontend
# stal kiedys na innej domenie niz API, trzeba by "none" - ale wtedy
# ciasteczko chodzi po obcych stronach i CSRF robi sie znacznie trudniejszy.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# --- PRACA ZA POSREDNIKIEM ---------------------------------------------------
# Ruch idzie przez Caddy/tunel, ktory konczy HTTPS i dalej rozmawia po HTTP.
# Bez tego Spring uznaje, ze stoi na http: nie ustawi flagi Secure na
# ciasteczku i zbuduje przekierowania z adresem http, ktore przegladarka
# odrzuci jako mieszana tresc.
server.forward-headers-strategy=framework

# --- LOGI --------------------------------------------------------------------
# W trybie deweloperskim wlaczony jest TRACE na wiazaniu parametrow zapytan.
# Na serwerze to wyciek: do logow trafialyby adresy e-mail i skroty hasel
# przekazywane do bazy.
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.SQL=WARN
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- DOKUMENTACJA API --------------------------------------------------------
# Swagger to kompletna mapa API razem z ksztaltem kazdego zapytania. Na etapie
# pisania projektu bezcenny, publicznie - niepotrzebne ulatwienie dla kogos,
# kto szuka dziury. Wlacz z powrotem zmienna, jesli bedziesz go potrzebowal.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# --- PULA POLACZEN -----------------------------------------------------------
# Domyslne 10 polaczen to duzo jak na jeden maly serwer, na ktorym obok stoi
# jeszcze baza. Przy mniejszej puli PostgreSQL ma wiecej pamieci dla siebie.
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}
spring.datasource.hikari.connection-timeout=10000

# --- BLEDY -------------------------------------------------------------------
# Domyslnie Spring potrafi odeslac sciezke i komunikat wyjatku. To podpowiedz
# o strukturze aplikacji - na zewnatrz wystarczy sam kod bledu.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
