# =============================================================================
#  KROK 2 planu: polaczenie Spring Boota z baza PostgreSQL
# =============================================================================
spring.application.name=musicclubapp

# --- POLACZENIE Z BAZA ---------------------------------------------------
# Format: jdbc:postgresql://HOST:PORT/NAZWA_BAZY
# ${ZMIENNA:wartosc_domyslna} - Spring najpierw szuka zmiennej srodowiskowej,
# a jak jej nie ma, bierze wartosc po dwukropku. Dzieki temu ten sam plik
# dziala i lokalnie (localhost), i pozniej w Dockerze (host = "db").
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:musicclub}
spring.datasource.username=${DB_USER:musicclub}
spring.datasource.password=${DB_PASSWORD:musicclub}

# --- JPA / HIBERNATE -----------------------------------------------------
# ddl-auto=update -> Hibernate sam tworzy/dopisuje tabele na podstawie encji.
#   Wygodne na etapie nauki i pisania projektu.
#   (validate = tylko sprawdza zgodnosc, none = nic nie robi, create-drop = kasuje przy stopie)
#
# NA SERWERZE JEST INACZEJ: profil "prod" przestawia to na validate i oddaje
# schemat pod Flyway. Patrz application-prod.properties.
spring.jpa.hibernate.ddl-auto=update

# Migracje sa wylaczone poza produkcja. W pracy nad kodem schemat robi
# ddl-auto=update, a testy chodza na H2 z create-drop - gdyby Flyway dzialal
# wszedzie, probowalby puscic na H2 zrzut skladni PostgreSQL.
spring.flyway.enabled=false

# Wypisuje w konsoli kazde zapytanie SQL, ktore Hibernate wysyla do bazy.
# Zostaw wlaczone - najlepszy sposob, zeby ZOBACZYC co JPA robi pod spodem.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Nie trzymaj polaczenia z baza otwartego przez caly czas obslugi requestu.
# Wymusza swiadome ladowanie danych w serwisie (mniej bledow LazyInitializationException
# przez przypadek, wiecej kontroli).
spring.jpa.open-in-view=false

# --- LOGOWANIE -----------------------------------------------------------
# Pokazuje wartosci podstawiane pod znaki "?" w SQL-u
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# --- JEZYKI (wymaganie nr 2) ---------------------------------------------
# Wyklad 2, slajd 42: sciezka do plikow z tekstami (liczona od folderu
# resources) wraz z ich domyslna nazwa. Spring sam dobierze messages_pl.properties,
# gdy zapytanie poprosi o jezyk polski.
spring.messages.basename=lang/messages
spring.messages.encoding=UTF-8

# --- SPRING SECURITY (wymagania nr 15 i 17) ------------------------------
# Klucz podpisujacy ciasteczko "zapamietaj mnie". Na potrzeby nauki wartosc
# domyslna wystarczy, ale przy oddawaniu projektu ustaw wlasna - kazdy,
# kto zna ten klucz, moze podrobic ciasteczko logowania.
app.remember-me.key=${REMEMBER_ME_KEY:musicclub-dev-key-zmien-mnie}
app.remember-me.validity-seconds=1209600

# Adresy frontendu, ktoremu pozwalamy sie laczyc (CORS).
# 5173 to domyslny port Vite (React), 4173 - "npm run preview" (wersja zbudowana,
# jedyna, w ktorej dziala service worker), 3000 - Create React App.
#
# Po wystawieniu aplikacji na serwer TRZEBA ustawic CORS_ORIGINS na prawdziwy
# adres. Bez tego przegladarka dostanie 403 przy kazdym zapisie - i bedzie to
# wygladalo na blad logowania, a nie na brak wpisu na liscie.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000}

# --- KONTO ADMINISTRATORA ---------------------------------------------------
# Zakladane automatycznie przy pierwszym starcie, jesli w bazie nie ma jeszcze
# zadnego admina (patrz config/AdminInitializer). Rejestracja przez formularz
# zawsze tworzy zwyklego uzytkownika, wiec to jedyna droga do pierwszego admina.
#
# Wartosci domyslne sa TYLKO do nauki. Przed oddaniem projektu ustaw wlasne,
# np. przez zmienne srodowiskowe ADMIN_USERNAME / ADMIN_PASSWORD.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@musicclub.local}
app.admin.password=${ADMIN_PASSWORD:admin12345}

# --- WGRANE PLIKI (zdjecia w postach, avatary) ------------------------------
# Katalog na dysku, w ktorym ladują sie obrazki. W bazie trzymamy tylko nazwy.
app.uploads.dir=${UPLOADS_DIR:uploads}

# Limity dla wgrywanych plikow. max-request-size dotyczy CALEGO zapytania,
# wiec przy 10 zdjeciach po 5 MB musi byc odpowiednio wiekszy niz max-file-size.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=60MB

# --- SWAGGER (wymaganie nr 24) -------------------------------------------
# Dokumentacja API: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- SERWER --------------------------------------------------------------
server.port=8080

# --- ACTUATOR (KROK 6: Docker) ----------------------------------------------
# Wystawiamy TYLKO /actuator/health - Docker sprawdza nim, czy backend wstal.
# Domyslnie Actuator udostepnia takze m.in. liste zmiennych srodowiskowych
# i konfiguracje, wiec ograniczamy go do jednego endpointu.
management.endpoints.web.exposure.include=health

# "show-details=never" - na zewnatrz idzie samo {"status":"UP"}, bez informacji
# o wersji bazy i stanie polaczen. Docker potrzebuje tylko kodu odpowiedzi.
management.endpoint.health.show-details=never

# --- KATALOG MUZYCZNY: DEEZER I LAST.FM ------------------------------------
# Deezer dziala BEZ zadnego klucza - uzywamy tylko jego czesci katalogowej
# (wyszukiwanie artystow i utworow). Nikt sie do Deezera nie loguje.
app.music.catalog.timeout-ms=4000

# Last.fm sluzy do zaimportowania historii sluchania i do gatunkow artystow.
# Klucz jest OPCJONALNY: bez niego przycisk importu sie nie pokazuje, a reczne
# dodawanie ulubionych z katalogu Deezera dziala normalnie.
# Klucz zakladasz w minute na https://www.last.fm/api/account/create
app.lastfm.api-key=${LASTFM_API_KEY:}

# --- GIF-Y: przegladarka GIF-ow w komentarzach i na czacie ------------------
# Serwer pyta dostawce w imieniu uzytkownika (klucz nie trafia do przegladarki,
# dostawca nie widzi adresow IP ani kont), a wyniki podpisuje, zeby do rozmowy
# nie dalo sie przemycic dowolnego adresu obrazka. Dostawca: klipy (nastepca
# Tenora, darmowy) albo giphy. Bez GIF_API_KEY przycisk GIF w ogole sie nie pokazuje.
app.gifs.provider=${GIF_PROVIDER:klipy}
app.gifs.api-key=${GIF_API_KEY:}
app.gifs.klipy.base-url=https://api.klipy.com/api/v1
app.gifs.giphy.base-url=https://api.giphy.com/v1
# Tylko dla GIPHY: g, pg, pg-13 albo r
app.gifs.rating=pg-13
app.gifs.timeout-ms=6000
# Wyszukiwan na minute na osobe i jak dlugo wynik zostaje w pamieci serwera
app.gifs.searches-per-minute=30
app.gifs.cache-seconds=300

# Gorne limity ulubionych. To nie jest zlosliwosc wobec uzytkownika, tylko
# warunek tego, zeby dopasowywanie ludzi mialo sens: ktos z lista pieciuset
# wykonawcow pasowalby do wszystkich naraz, czyli do nikogo.
app.favorites.max-artists=30
app.favorites.max-tracks=30

# --- WYDARZENIA: TICKETMASTER ---------------------------------------------
# Zakladka Wydarzenia bierze koncerty z Ticketmaster Discovery API. Klucz jest
# darmowy (5000 zapytan dziennie) - zakladasz go na developer.ticketmaster.com,
# w "My Apps" jest pod nazwa "Consumer Key".
#
# Bez klucza aplikacja dziala normalnie, tylko zakladka jest pusta.
app.ticketmaster.api-key=${TICKETMASTER_API_KEY:}

# Import idzie w tle: pierwszy raz 30 sekund po starcie. Udany powtarza sie
# co 6 godzin, a nieudany - przy najblizszym sprawdzeniu, co kwadrans.
# Jeden przebieg to okolo 15-25 zapytan, czyli mniej niz 100 dziennie przy
# limicie 5000 (a przy awarii sieci zapytania i tak nie dochodza).
app.events.import.initial-delay-ms=30000
app.events.import.interval-ms=21600000
app.events.import.check-ms=900000

# Przypomnienia o wydarzeniach (dzwonek i push): na ile dni przed wydarzeniem
# i kiedy sprawdzac - co godzine od 9 do 21 czasu polskiego, zeby telefon nie
# dzwonil w nocy.
app.events.reminders.days=3,1
app.events.reminders.cron=0 7 9-21 * * *

# --- Poczta i potwierdzanie adresu e-mail -----------------------------------
#
# Z tymi zmiennymi serwer wysyla przy rejestracji link potwierdzajacy, a konto
# bez potwierdzenia nie moze sie zalogowac. Bez MAIL_HOST poczta jest wylaczona
# i wszystkie konta licza sie jako potwierdzone. Jak zalozyc skrzynke do
# wysylki (Gmail z haslem aplikacji, Brevo) - docs/WDROZENIE.md.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Nadawca: "MusicClub <adres>" albo sam adres. Domyslnie konto, przez ktore wysylamy.
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# Actuator sam dodaje sprawdzanie serwera pocztowego do /actuator/health.
# Przy pustym MAIL_HOST zdrowie wychodziloby DOWN, a Docker restartowalby
# zdrowy backend; przy ustawionym - co 10 sekund laczylibysmy sie z SMTP.
management.health.mail.enabled=false

# Adres strony w linkach z wiadomosci, np. https://musicclub.example.com.
# W pracy lokalnej frontend chodzi na 5173 (Vite), a backend na 8080 - adres
# z zapytania wskazywalby backend, wiec domyslnie jest tu Vite.
app.public-url=${APP_PUBLIC_URL:http://localhost:5173}

# --- Powiadomienia push (Web Push) ------------------------------------------
#
# Bez kluczy push jest wylaczony, a powiadomienia sa tylko w dzwonku. Klucze
# generuje sie raz: npx web-push generate-vapid-keys (albo openssl - patrz
# docs/WDROZENIE.md). Kontakt dla uslug push: mailto:... albo adres https;
# pusty = APP_PUBLIC_URL, jesli zaczyna sie od https.
app.push.public-key=${VAPID_PUBLIC_KEY:}
app.push.private-key=${VAPID_PRIVATE_KEY:}
app.push.subject=${VAPID_SUBJECT:}
# Jak dlugo usluga push trzyma wiadomosc dla wylaczonego telefonu (sekundy).
app.push.ttl-seconds=86400

# --- Regulamin i polityka prywatnosci ---------------------------------------
#
# Wersja = data ostatniej zmiany tresci w frontend/src/legal/. Podniesienie jej sprawia, ze kazdy
# zalogowany dostanie prosbe o ponowna akceptacje. Administrator danych i kontakt to dane osobowe
# wlasciciela serwisu - NIE leza w repozytorium, tylko w .env (LEGAL_CONTROLLER, LEGAL_CONTACT_EMAIL).
app.legal.version=2026-09-30
app.legal.controller=${LEGAL_CONTROLLER:}
app.legal.contact-email=${LEGAL_CONTACT_EMAIL:}
# Kto prowadzi serwer i przez kogo idzie poczta - polityka prywatnosci wymienia odbiorcow danych.
app.legal.hosting=${LEGAL_HOSTING:}
app.legal.mail-provider=${LEGAL_MAIL_PROVIDER:}
