# Wersja webowa: publikuje aplikacje na GitHub Pages (Settings -> Pages -> Source: "GitHub Actions").
# Aplikacja nie ma serwera, wiec to zwykle pliki statyczne; dane i klucze zostaja w przegladarce kazdego uzytkownika.
name: Strona (GitHub Pages)

on:
  workflow_dispatch:   # ręcznie: Actions -> "Strona (GitHub Pages)" -> Run workflow (wymaga zgody gałęzi w Settings -> Environments -> github-pages)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
