# Buduje plik APK do zainstalowania na telefonie z Androidem.
# Uruchamia sie po kazdym pushu na te galaz albo recznie (Actions -> "Android APK" -> Run workflow).
# Gotowy plik: na stronie przebiegu, w sekcji "Artifacts" (musicclub-debug-apk).
name: Android APK

on:
  push:
    branches: [release/solo]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK jest już na obrazie ubuntu-latest (ANDROID_HOME). Krok android-actions/setup-android@v3
      # wywracał się na `sdkmanager tools`, więc zostaje tylko akceptacja licencji.
      - name: Licencje Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Zaleznosci i testy
        run: |
          npm ci
          npm test

      - name: Budowa aplikacji webowej i synchronizacja z projektem Androida
        run: |
          npm run build
          npx cap sync android

      - name: Budowa APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: musicclub-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
